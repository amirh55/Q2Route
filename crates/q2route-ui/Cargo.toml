[package]
name = "q2route-ui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "q2route"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
q2route-core = { path = "../q2route-core" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
serde_json = "1"
toml = "0.9"
tray-icon = "0.26"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security", "Win32_NetworkManagement_Dns", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Time", "Win32_UI_Controls_Dialogs", "Win32_Networking_WinHttp", "Win32_Security_Cryptography"] }

[dev-dependencies]
q2route-service = { path = "../q2route-service" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
